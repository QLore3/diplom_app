name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image metadata
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker build --build-arg APP_VERSION="$VERSION" --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" .

      - name: Check container
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          docker run -d --name app --publish 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL \
            --security-opt no-new-privileges --memory 32m "$IMAGE:sha-$GITHUB_SHA"
          trap 'docker rm -f app >/dev/null' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          docker exec app nginx -t
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/assets/dancing-cat.gif
          curl --fail --silent http://127.0.0.1:8080/version.json | \
            python3 -c 'import json, os, sys; assert json.load(sys.stdin)["revision"] == os.environ["GITHUB_SHA"]'

      - name: Publish to GHCR
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Published: \`$IMAGE:sha-$GITHUB_SHA\` and \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
